<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e6c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGradient)"/>
  
  <!-- Header -->
  <rect width="1200" height="100" fill="url(#accentGradient)"/>
  
  <!-- Logo/Basket Icon -->
  <g transform="translate(50, 30)">
    <circle cx="20" cy="20" r="20" fill="#4caf50"/>
    <path d="M 10 15 L 15 8 L 25 8 L 30 15 L 28 32 Q 28 35 25 35 L 15 35 Q 12 35 12 32 Z" fill="white" stroke="white" stroke-width="1.5"/>
    <circle cx="16" cy="28" r="2" fill="#4caf50"/>
    <circle cx="24" cy="28" r="2" fill="#4caf50"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">Green Basket</text>
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="14" fill="#e8f5e9">Local shopping, made simple</text>
  
  <!-- Main Content Area -->
  <rect x="60" y="130" width="1080" height="580" fill="white" rx="12"/>
  
  <!-- Store Cards Container Title -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1b5e20">Discover Local Stores</text>
  
  <!-- Store Card 1 -->
  <g transform="translate(100, 210)">
    <rect width="300" height="240" fill="#f5f5f5" rx="8" stroke="#e0e0e0" stroke-width="1"/>
    <rect width="300" height="150" fill="#81c784" rx="8 8 0 0"/>
    <text x="150" y="85" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Fresh Produce</text>
    <rect x="20" y="160" width="260" height="50" fill="white"/>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b5e20">Organic Market</text>
    <text x="30" y="205" font-family="Arial, sans-serif" font-size="12" fill="#666">📍 2.4 km away</text>
  </g>
  
  <!-- Store Card 2 -->
  <g transform="translate(450, 210)">
    <rect width="300" height="240" fill="#f5f5f5" rx="8" stroke="#e0e0e0" stroke-width="1"/>
    <rect width="300" height="150" fill="#66bb6a" rx="8 8 0 0"/>
    <text x="150" y="85" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Grocery Store</text>
    <rect x="20" y="160" width="260" height="50" fill="white"/>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b5e20">Fresh Mart</text>
    <text x="30" y="205" font-family="Arial, sans-serif" font-size="12" fill="#666">📍 1.8 km away</text>
  </g>
  
  <!-- Store Card 3 -->
  <g transform="translate(800, 210)">
    <rect width="300" height="240" fill="#f5f5f5" rx="8" stroke="#e0e0e0" stroke-width="1"/>
    <rect width="300" height="150" fill="#4caf50" rx="8 8 0 0"/>
    <text x="150" y="85" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Local Vendor</text>
    <rect x="20" y="160" width="260" height="50" fill="white"/>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1b5e20">Green Valley</text>
    <text x="30" y="205" font-family="Arial, sans-serif" font-size="12" fill="#666">📍 3.1 km away</text>
  </g>
  
  <!-- Features Section -->
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1b5e20">Why Green Basket?</text>
  
  <!-- Feature Items -->
  <g transform="translate(100, 520)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Support local businesses and neighborhood shops</text>
  </g>
  
  <g transform="translate(100, 560)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Browse fresh products from trusted vendors</text>
  </g>
  
  <g transform="translate(100, 600)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Find stores near you with location-based search</text>
  </g>
  
  <g transform="translate(600, 520)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Easy to use marketplace interface</text>
  </g>
  
  <g transform="translate(600, 560)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Shop fresh products in your neighborhood</text>
  </g>
  
  <g transform="translate(600, 600)">
    <circle cx="10" cy="10" r="5" fill="#4caf50"/>
    <text x="30" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Seamless, responsive shopping experience</text>
  </g>
</svg>